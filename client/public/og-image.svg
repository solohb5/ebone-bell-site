<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&amp;family=Inter:wght@400&amp;display=swap');
  </style>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#2C2825"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F5F2ED" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent line at top -->
  <rect x="80" y="80" width="120" height="3" fill="#D4572A"/>
  
  <!-- Main headline -->
  <text 
    x="80" 
    y="220" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="72" 
    font-weight="600"
    fill="#F5F2ED"
  >
    I build the protocol.
  </text>
  
  <text 
    x="80" 
    y="310" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="72" 
    font-weight="600"
  >
    <tspan fill="#F5F2ED">You </tspan>
    <tspan fill="#D4572A" font-style="italic">clock in</tspan>
    <tspan fill="#D4572A">.</tspan>
  </text>
  
  <!-- Subheadline -->
  <text 
    x="80" 
    y="400" 
    font-family="'Inter', sans-serif" 
    font-size="24" 
    fill="#F5F2ED"
    opacity="0.6"
  >
    Systems beat motivation. Every time.
  </text>
  
  <!-- Stats -->
  <text x="80" y="520" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="600" fill="#F5F2ED">20</text>
  <text x="80" y="550" font-family="'Inter', sans-serif" font-size="12" fill="#F5F2ED" opacity="0.5" letter-spacing="0.1em">YEARS</text>
  
  <text x="220" y="520" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="600" fill="#F5F2ED">8</text>
  <text x="220" y="550" font-family="'Inter', sans-serif" font-size="12" fill="#F5F2ED" opacity="0.5" letter-spacing="0.1em">GYMS</text>
  
  <text x="320" y="520" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="600" fill="#F5F2ED">$20M</text>
  <text x="320" y="550" font-family="'Inter', sans-serif" font-size="12" fill="#F5F2ED" opacity="0.5" letter-spacing="0.1em">REVENUE</text>
  
  <!-- Logo mark -->
  <text 
    x="1000" 
    y="550" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="64" 
    font-weight="600"
  >
    <tspan fill="#F5F2ED">TR</tspan>
    <tspan fill="#D4572A">.</tspan>
  </text>
  
  <!-- Accent line at bottom right -->
  <rect x="1000" y="560" width="120" height="2" fill="#D4572A" opacity="0.5"/>
</svg>

